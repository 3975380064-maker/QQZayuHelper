name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 直接用 runner 预装的 Android SDK，不走 android-actions/setup-android：
# 那个 action 会在下载 cmdline-tools 时拿到 Azure Blob 的
# InvalidAuthenticationInfo 而直接失败（2026-09 实测），与本工程无关。
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::runner 上没有找到预装的 Android SDK"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "使用 SDK: $SDK"
          ls "$SDK"

          # 只补缺的组件（runner 镜像通常已经带好，这里是兜底）
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ] && [ ! -d "$SDK/platforms/android-35" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-35" "build-tools;35.0.0"
          fi
          echo "已安装 platforms:"
          ls "$SDK/platforms" 2>/dev/null || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit test and Lint
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon

      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew assembleDebug --no-daemon

      # 打 tag 时才走发布流程。没有签名密钥就整段跳过 ——
      # 绝不能把未签名的包发到 Release：它无法覆盖安装，会直接把用户的更新链路弄坏。
      - name: Check release keystore
        id: ks
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 KEYSTORE_BASE64，跳过发布（不会产出未签名包）"
          fi

      - name: Prepare release keystore
        if: startsWith(github.ref, 'refs/tags/v') && steps.ks.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build and verify release APK
        if: startsWith(github.ref, 'refs/tags/v') && steps.ks.outputs.available == 'true'
        run: |
          ./gradlew assembleRelease --no-daemon
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/QQZayuHelper.apk
          # 校验确实签名了，避免把坏包发出去
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs out/QQZayuHelper.apk
          sha256sum out/QQZayuHelper.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') && steps.ks.outputs.available == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # 资源名必须是 QQZayuHelper.apk，App 内的更新器依赖这个固定名字
          files: out/QQZayuHelper.apk
          generate_release_notes: true

      - name: Upload debug APK artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
